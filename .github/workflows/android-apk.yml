name: Build BEAUTYBOOK Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract BEAUTYBOOK project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o BEAUTYBOOK_MVP.zip -d extracted
          cp -a extracted/beautybook_flutter/. .

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name beautybook .

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BEAUTYBOOK-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
